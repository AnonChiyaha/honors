<meta charset="UTF-8">

<title>🔒 需要密码</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f8f9fa; color: #1a1a2e; line-height: 1.6;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .lock-box {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 14px;
    padding: 40px 32px; width: 92%; max-width: 360px; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
  }
  .lock-box .icon { font-size: 3rem; margin-bottom: 12px; }
  .lock-box h1 { font-size: 1.3rem; margin-bottom: 6px; }
  .lock-box p { color: #6b7280; font-size: 0.9rem; margin-bottom: 20px; }
  .lock-box input {
    width: 100%; padding: 12px 14px; border: 1px solid #d0d0d0; border-radius: 9px;
    font-size: 1rem; text-align: center; outline: none; margin-bottom: 14px;
    font-family: inherit; letter-spacing: 2px;
  }
  .lock-box input:focus { border-color: #7c3aed; }
  .lock-box button {
    width: 100%; padding: 12px; border: none; border-radius: 9px;
    background: #7c3aed; color: #fff; font-size: 1rem; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .lock-box button:hover { opacity: 0.9; }
  .lock-box .err { color: #dc2626; font-size: 0.85rem; margin-top: 12px; min-height: 20px; }
  .lock-box .hint { color: #9ca3af; font-size: 0.75rem; margin-top: 16px; }
</style>
</head>

</div>

const ITER = 100000;

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function unlock() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  if (!pw) { err.textContent = '请输入密码'; return; }
  err.textContent = '解密中…';

  try {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToBytes(SALT), iterations: ITER, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const decrypted = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(IV) }, key, b64ToBytes(DATA)
    );
    const html = new TextDecoder().decode(decrypted);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    err.textContent = '密码错误，请重试';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}
